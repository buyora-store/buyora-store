  <style>

    /* =========================================================
       BUYORA FINAL DESIGN
       PART 1 / 4
       ========================================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;
      background: #f8f7fc;
      color: #151327;
      line-height: 1.5;
      overflow-x: hidden;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      max-width: 100%;
      display: block;
    }

    /* =========================================================
       GLOBAL
       ========================================================= */

    :root {
      --purple: #6c2cff;
      --purple-dark: #4c18c9;
      --purple-light: #eee7ff;
      --yellow: #ffd000;
      --navy: #151327;
      --muted: #706c82;
      --white: #ffffff;
      --border: #e9e6f2;
      --green: #12a66a;
      --red: #ef4444;
      --shadow:
        0 12px 35px rgba(42, 25, 83, 0.09);
      --radius: 22px;
    }

    .container {
      width: 100%;
      max-width: none;
      padding-left: clamp(12px, 2.2vw, 30px);
      padding-right: clamp(12px, 2.2vw, 30px);
    }

    .section {
      padding-top: 55px;
      padding-bottom: 55px;
    }

    .section-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 25px;
    }

    .section-title {
      font-size: clamp(25px, 3vw, 38px);
      font-weight: 900;
      letter-spacing: -1px;
    }

    .section-subtitle {
      color: var(--muted);
      margin-top: 5px;
      font-size: 14px;
    }

    .view-all {
      border: 0;
      background: transparent;
      color: var(--purple);
      font-weight: 800;
      white-space: nowrap;
    }

    .hidden {
      display: none !important;
    }

    /* =========================================================
       TOP ANNOUNCEMENT
       ========================================================= */

    .announcement {
      min-height: 38px;
      background: var(--navy);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 7px 15px;
      font-size: 13px;
      text-align: center;
      font-weight: 600;
    }

    .announcement strong {
      color: var(--yellow);
      margin: 0 4px;
    }

    /* =========================================================
       HEADER
       ========================================================= */

    .header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      min-height: 78px;
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .logo {
      min-width: 150px;
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .logo-mark {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: var(--purple);
      color: white;
      display: grid;
      place-items: center;
      font-size: 21px;
      font-weight: 900;
      box-shadow:
        0 8px 18px rgba(108,44,255,.25);
    }

    .logo-text {
      font-size: 25px;
      font-weight: 950;
      letter-spacing: -1.2px;
    }

    .logo-text span {
      color: var(--purple);
    }

    .search-box {
      flex: 1;
      max-width: 650px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      height: 48px;
      border: 1px solid var(--border);
      background: #f6f4fa;
      border-radius: 15px;
      outline: none;
      padding: 0 48px 0 17px;
      transition: .2s;
    }

    .search-box input:focus {
      border-color: var(--purple);
      background: white;
      box-shadow:
        0 0 0 4px rgba(108,44,255,.08);
    }

    .search-button {
      position: absolute;
      right: 5px;
      top: 5px;
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 11px;
      background: var(--purple);
      color: white;
      font-size: 17px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .header-action {
      position: relative;
      min-width: 44px;
      height: 44px;
      border: 1px solid var(--border);
      background: white;
      border-radius: 14px;
      display: grid;
      place-items: center;
      font-size: 19px;
      transition: .2s;
    }

    .header-action:hover {
      border-color: var(--purple);
      color: var(--purple);
      transform: translateY(-1px);
    }

    .badge {
      position: absolute;
      right: -5px;
      top: -5px;
      min-width: 19px;
      height: 19px;
      padding: 0 5px;
      border-radius: 20px;
      background: var(--purple);
      color: white;
      font-size: 10px;
      display: grid;
      place-items: center;
      font-weight: 800;
    }

    .desktop-nav {
      display: flex;
      align-items: center;
      gap: 22px;
      padding-bottom: 13px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .desktop-nav::-webkit-scrollbar {
      display: none;
    }

    .desktop-nav a {
      color: #504b61;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      transition: .2s;
    }

    .desktop-nav a:hover {
      color: var(--purple);
    }

    .mobile-menu-button {
      display: none;
      width: 44px;
      height: 44px;
      border: 0;
      background: var(--purple-light);
      border-radius: 13px;
      color: var(--purple);
      font-size: 21px;
    }

    /* =========================================================
       HERO
       ========================================================= */

    .hero {
      padding: 18px 0 0;
    }

    .hero-slider {
      position: relative;
      width: 100%;
      min-height: 455px;
      border-radius: 30px;
      overflow: hidden;
      background:
        linear-gradient(
          135deg,
          #17102f,
          #4e20a7
        );
      box-shadow: var(--shadow);
    }

    .hero-slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity .5s ease;
      padding: clamp(30px, 6vw, 80px);
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      align-items: center;
      gap: 20px;
    }

    .hero-slide.active {
      opacity: 1;
      pointer-events: auto;
    }

    .hero-content {
      color: white;
      position: relative;
      z-index: 2;
    }

    .hero-tag {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.18);
      padding: 8px 13px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 17px;
    }

    .hero-title {
      font-size: clamp(42px, 6vw, 78px);
      line-height: .94;
      letter-spacing: -3px;
      font-weight: 950;
      max-width: 760px;
    }

    .hero-title span {
      color: var(--yellow);
    }

    .hero-text {
      margin-top: 18px;
      max-width: 560px;
      color: rgba(255,255,255,.78);
      font-size: 16px;
    }

    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 11px;
      margin-top: 27px;
    }

    .primary-btn {
      border: 0;
      background: var(--yellow);
      color: #1b1706;
      min-height: 48px;
      padding: 0 21px;
      border-radius: 14px;
      font-weight: 900;
      transition: .2s;
    }

    .primary-btn:hover {
      transform: translateY(-2px);
      box-shadow:
        0 10px 20px rgba(0,0,0,.16);
    }

    .secondary-btn {
      border: 1px solid rgba(255,255,255,.25);
      background: rgba(255,255,255,.1);
      color: white;
      min-height: 48px;
      padding: 0 21px;
      border-radius: 14px;
      font-weight: 800;
    }

    .hero-art {
      min-height: 340px;
      position: relative;
      display: grid;
      place-items: center;
    }

    .hero-circle {
      width: min(330px, 65vw);
      aspect-ratio: 1;
      border-radius: 50%;
      background:
        radial-gradient(
          circle at 35% 30%,
          #ffffff,
          #ded3ff 55%,
          #a987ff
        );
      box-shadow:
        0 30px 70px rgba(0,0,0,.25);
      display: grid;
      place-items: center;
      font-size: clamp(90px, 13vw, 170px);
    }

    .floating-card {
      position: absolute;
      background: white;
      color: var(--navy);
      border-radius: 18px;
      padding: 13px 15px;
      box-shadow:
        0 15px 35px rgba(0,0,0,.18);
      font-weight: 800;
      font-size: 13px;
    }

    .floating-card.one {
      top: 15%;
      left: 3%;
    }

    .floating-card.two {
      right: 1%;
      bottom: 13%;
    }

    .slider-controls {
      position: absolute;
      left: 30px;
      bottom: 25px;
      display: flex;
      gap: 7px;
      z-index: 5;
    }

    .slider-dot {
      width: 25px;
      height: 7px;
      border: 0;
      border-radius: 20px;
      background: rgba(255,255,255,.3);
      transition: .25s;
    }

    .slider-dot.active {
      width: 42px;
      background: var(--yellow);
    }

       QUICK CATEGORIES

    }

    .quick-card {
      border: 1px solid var(--border);
      background: white;
      border-radius: 18px;
      padding: 17px 12px;

    /* =======================================================
       STORAGE HELPERS
       ======================================================= */

    function loadStorage(key, fallback) {

      try {

        const value =
          localStorage.getItem(key);

        if (!value) {
          return fallback;
        }

        return JSON.parse(value);

      } catch (error) {

        return fallback;

      }

    }


    function saveStorage(key, value) {

      try {

        localStorage.setItem(
          key,
          JSON.stringify(value)
        );

      } catch (error) {

        console.warn(
          "Buyora storage error:",
          error
        );

      }

    }


    /* =======================================================
       FORMATTERS
       ======================================================= */

    function formatPrice(value) {

      return "Rs. " +
        Number(value || 0)
          .toLocaleString("en-PK");

    }


    function escapeHTML(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    function getStars(rating) {

      const rounded =
        Math.round(Number(rating) || 0);

      return "★".repeat(rounded) +
        "☆".repeat(
          Math.max(0, 5 - rounded)
        );

    }


    /* =======================================================
       DELIVERY
       ======================================================= */

    function calculateDelivery(subtotal) {

      if (subtotal <= 0) {
        return 0;
      }

      return subtotal >= FREE_DELIVERY_LIMIT
        ? 0
        : DELIVERY_FEE;

    }


    /* =======================================================
       FILTER / SORT
       ======================================================= */

    function getFilteredProducts() {

      let list = products.slice();

      if (currentView === "deals") {

        list = list.filter(
          product =>
            Number(product.discount) >= 25
        );

      }

      if (currentView === "wishlist") {

        list = list.filter(
          product =>
            wishlist.includes(product.id)
        );

      }

      if (
        currentCategory &&
        currentCategory !== "All"
      ) {

        list = list.filter(
          product =>
            product.category === currentCategory
        );

      }

      if (currentSearch.trim()) {

        const query =
          currentSearch
            .trim()
            .toLowerCase();

        list = list.filter(product => {

          const text =
            [
              product.name,
              product.category,
              product.description
            ]
              .join(" ")
              .toLowerCase();

          return text.includes(query);

        });

      }

      /*
        IMPORTANT:
        Always start from products.slice()
        so Featured restores original order.
      */

      if (currentSort === "low") {

        list.sort(
          (a, b) =>
            Number(a.price) -
            Number(b.price)
        );

      } else if (currentSort === "high") {

        list.sort(
          (a, b) =>
            Number(b.price) -
            Number(a.price)
        );

      } else if (currentSort === "rating") {

        list.sort(
          (a, b) =>
            Number(b.rating) -
            Number(a.rating)
        );

      } else if (currentSort === "discount") {

        list.sort(
          (a, b) =>
            Number(b.discount) -
            Number(a.discount)
        );

      }

      return list;

    }

    /* =======================================================
       RENDER PRODUCTS
       ======================================================= */

    function renderProducts() {

      const container =
        document.getElementById("productList");

      if (!container) {
        return;
      }

      const list =
        getFilteredProducts();

      if (list.length === 0) {

        container.innerHTML = `

          <div class="no-products">

            <div>

              <div class="no-products-icon">
                🔍
              </div>

              <h3>
                No products found
              </h3>

              <p>
                Try another search or category.
              </p>

              <button
                class="primary-btn"
                type="button"
                style="margin-top:15px;"
                onclick="showAllProducts()"
              >
                Show All Products
              </button>

            </div>

          </div>

        `;

      } else {

        container.innerHTML =
          list.map(createProductCard).join("");

      }

      const results =
        document.getElementById("resultsText");

      if (results) {

        results.textContent =
          `${list.length} product${list.length === 1 ? "" : "s"} found`;

      }

      const title =
        document.getElementById("productsTitle");

      const subtitle =
        document.getElementById("productsSubtitle");

      if (title) {

        if (currentView === "deals") {

          title.textContent =
            "Today's Deals";

        } else if (currentView === "wishlist") {

          title.textContent =
            "My Wishlist";

        } else if (
          currentSearch.trim()
        ) {

          title.textContent =
            `Search: "${currentSearch.trim()}"`;

        } else if (
          currentCategory !== "All"
        ) {

          title.textContent =
            currentCategory;

        } else {

          title.textContent =
            "All Products";

        }

      }

      if (subtitle) {

        if (currentView === "wishlist") {

          subtitle.textContent =
            "Products you saved for later";

        } else if (currentView === "deals") {

          subtitle.textContent =
            "Selected products with special discounts";

        } else {

          subtitle.textContent =
            "Discover our latest products and deals";

        }

      }

    }

       DEAL PRODUCTS
       ======================================================= */

    function renderDealProducts() {

      const container =
        document.getElementById("dealProducts");

      if (!container) {
        return;
      }

      const deals =
        products
          .filter(
            product =>
              Number(product.discount) >= 25

          .sort(
            (a, b) =>
              Number(b.discount) -
              Number(a.discount)
          )
          .slice(0, 5);

      container.innerHTML =
        deals
          .map(createProductCard)
          .join("");

    }

    /* =======================================================
       CART
       ======================================================= */

    function addToCart(productId) {

      const product =
        products.find(
          item =>
            Number(item.id) === Number(productId)
        );

      if (!product) {
        return;
      }

      if (product.affiliate) {

        openAffiliate(product.id);

        return;

      }

      const existing =
        cart.find(
          item =>
            Number(item.id) === Number(product.id)
        );

      if (existing) {

        existing.quantity =
          Number(existing.quantity || 0) + 1;

      } else {

        cart.push({

          id: product.id,

          quantity: 1

        });

      }

      saveStorage(
        STORAGE_KEYS.cart,
        cart
      );

      updateCart();

      showToast(
        `${product.name} added to cart.`,
        "success"
      );

    }


    function removeFromCart(productId) {

      cart =
        cart.filter(
          item =>
            Number(item.id) !== Number(productId)
        );

      saveStorage(
        STORAGE_KEYS.cart,
        cart
      );

      updateCart();

    }


    function changeQuantity(
      productId,
      change
    ) {

      const item =
        cart.find(
          entry =>
            Number(entry.id) ===
            Number(productId)
        );

      if (!item) {
        return;
      }

      item.quantity =
        Number(item.quantity || 0) +
        Number(change || 0);

      if (item.quantity <= 0) {

        removeFromCart(productId);

        return;

      }

      saveStorage(
        STORAGE_KEYS.cart,
        cart
      );

      updateCart();

    }


    function clearCart() {

      if (!cart.length) {

        showToast(
          "Your cart is already empty."
        );

        return;

      }

      cart = [];

      saveStorage(
        STORAGE_KEYS.cart,
        cart
      );

      updateCart();

      showToast(
        "Cart cleared."
      );

    }


    function getCartDetailedItems() {

      return cart
        .map(item => {

          const product =
            products.find(
              product =>
                Number(product.id) ===
                Number(item.id)
            );

          if (!product) {
            return null;
          }

          return {

            ...product,

            quantity:
              Math.max(
                1,
                Number(item.quantity || 1)
              )

          };

        })
        .filter(Boolean);

    }


    function getCartSubtotal() {

      return getCartDetailedItems()
        .reduce(
          (total, item) =>
            total +
            Number(item.price) *
            Number(item.quantity),
          0
        );

    }


    function updateCart() {

      renderCart();

      updateBadges();

    }


    function renderCart() {

      const container =
        document.getElementById("cartItems");

      const subtotal =
        getCartSubtotal();

      const delivery =
        calculateDelivery(subtotal);

      const total =
        subtotal + delivery;

      if (container) {

        const items =
          getCartDetailedItems();

        if (!items.length) {

          container.innerHTML = `

            <div class="empty-cart">

              <div class="empty-cart-icon">
                🛒
              </div>

              <strong>
                Your cart is empty
              </strong>

              <p style="margin-top:5px;">
                Add something you love.
              </p>

            </div>

          `;

        } else {

          container.innerHTML =
            items
              .map(item => `

                <div class="cart-item">

                  <img
                    src="${escapeHTML(item.image)}"
                    alt="${escapeHTML(item.name)}"
                    onerror="this.src='https://via.placeholder.com/150?text=Buyora'"
                  >

                  <div>

                    <div class="cart-item-name">
                      ${escapeHTML(item.name)}
                    </div>

                    <div class="cart-item-price">
                      ${formatPrice(item.price)}
                    </div>

                    <div class="quantity-row">

                      <button
                        type="button"
                        onclick="changeQuantity(${item.id},-1)"
                      >
                        −
                      </button>

                      <span class="quantity-number">
                        ${item.quantity}
                      </span>

                      <button
                        type="button"
                        onclick="changeQuantity(${item.id},1)"
                      >
                        +
                      </button>

                      <button
                        class="remove-item"
                        type="button"
                        onclick="removeFromCart(${item.id})"
                      >
                        Remove
                      </button>

                    </div>

                  </div>

                </div>

              `)
              .join("");

        }

      }

      const subtotalEl =
        document.getElementById("cartSubtotal");

      const deliveryEl =
        document.getElementById("cartDelivery");

      const totalEl =
        document.getElementById("cartTotal");

      if (subtotalEl) {
        subtotalEl.textContent =
          formatPrice(subtotal);
      }

      if (deliveryEl) {

        deliveryEl.textContent =
          delivery === 0
            ? "FREE"
            : formatPrice(delivery);

      }

      if (totalEl) {

        totalEl.textContent =
          formatPrice(total);

      }

    }

      if (image) {

      }

        price.textContent =
          formatPrice(product.price);
      }

      if (oldPrice) {
        oldPrice.textContent =
          formatPrice(product.oldPrice);
      }

      if (product.affiliate) {

        if (addButton) {

          addButton.classList.add("hidden");

        }

        if (buyButton) {

          buyButton.classList.remove("hidden");

          buyButton.textContent =

        }

          addButton.onclick =

              addToCart(product.id);

              closeProduct();

            };

        }

        if (buyButton) {

          buyButton.classList.remove("hidden");

          buyButton.textContent =
            "Buy Now";

          buyButton.onclick =
            () => {

              addToCart(product.id);

              closeProduct();

              setTimeout(() => {

                openCheckout();

      }

      if (modal) {
        modal.classList.add("show");

        document.getElementById("overlay");

        overlay.classList.add("active");
      }

        document.getElementById("productModal");

      if (modal) {
        modal.classList.remove("show");
      }

      const overlay =
        document.getElementById("overlay");

      if (overlay) {
        overlay.classList.remove("active");
      }

      currentProductId = null;

    }

       ======================================================= */

    function openAffiliate(productId) {

      const product =
        products.find(
          item =>
            Number(item.id) ===
            Number(productId)
        );

      if (
        !product ||
        !product.affiliate ||
        !product.affiliateLink
      ) {
        return;
      }

      window.open(
        product.affiliateLink,
        "_blank",
        "noopener,noreferrer"
      );

    }


    /* =======================================================

       ======================================================= */

    function updateBadges() {

      const cartBadge =
        document.getElementById("cartCount");

      const wishlistBadge =
        document.getElementById("wishlistBadge");

      const cartCount =
        cart.reduce(
          (total, item) =>
            total +
            Number(item.quantity || 0),
          0
        );

      if (cartBadge) {

        cartBadge.textContent =
          cartCount > 99
            ? "99+"
            : cartCount;

      }

      if (wishlistBadge) {

        wishlistBadge.textContent =
          wishlist.length > 99
            ? "99+"
            : wishlist.length;

      }

    }


    /* =======================================================
       TOAST
       ======================================================= */

    function showToast(
      message,
      type = "success"
    ) {

      let container =
        document.getElementById(
          "toastContainer"
        );

      if (!container) {

        container =
          document.createElement("div");

        container.id =
          "toastContainer";

        container.className =
          "toast-container";

        document.body.appendChild(
          container
        );

      }

      const toast =
        document.createElement("div");

      toast.className =
        `toast ${type}`;

      toast.textContent =
        message;

      container.appendChild(
        toast
      );

      setTimeout(() => {

        toast.remove();

      }, 3000);

    }

       PLACE ORDER
       ======================================================= */

    function placeOrder(event) {

      if (event) {

        event.preventDefault();

      }

      if (isPlacingOrder) {

        return;

      }

      if (!cart.length) {

        showToast(
          "Your cart is empty.",

        );

        document.querySelector(

         ------------------------------------------------------- */

        !name ||
        !phone ||
        !address ||
        !city

          "error"
        );

        return;

      }

      const cleanPhone =
        phone.replace(
          /[\s\-()]/g,
          ""
        );

      if (
        cleanPhone.length < 10 ||
        cleanPhone.length > 15
      ) {

        showToast(
          "Please enter a valid phone number.",
          "error"
        );

        return;

      }


      isPlacingOrder = true;


      /* -------------------------------------------------------
         ORDER CALCULATION
         ------------------------------------------------------- */

      const items =
        getCartDetailedItems();

      const subtotal =
        getCartSubtotal();

      const delivery =
        calculateDelivery(subtotal);

      const total =
        subtotal + delivery;


      /* -------------------------------------------------------
         ORDER ID
         ------------------------------------------------------- */

      const orderId =
        "BYR-" +
        String(
          Math.floor(
            100000 +
            Math.random() * 900000
          )
        );

         ------------------------------------------------------- */

      const order = {

        id: orderId,

        createdAt:

        status:
          "Order Received / Processing",

          city: city,

          email: email

        },

        payment:

        items:
          items.map(item => ({

            id: item.id,

            name: item.name,

            price: item.price,

            quantity: item.quantity,

            image: item.image

          })),

        subtotal:
          subtotal,

        delivery:
          delivery,

        total:
          total

      };


      /* -------------------------------------------------------
         SAVE ORDER
         ------------------------------------------------------- */

      orders.unshift(order);

      /*
        Keep local order history manageable.
      */

      if (orders.length > 50) {

        orders =
          orders.slice(0, 50);

      }

      saveStorage(
        STORAGE_KEYS.orders,
        orders
      );


      /* -------------------------------------------------------
         SAVE PROFILE
         ------------------------------------------------------- */

      profile = {

        name: name,

        phone: phone,

        address: address,

        city: city,

        email: email

      };

      saveStorage(
        STORAGE_KEYS.profile,
        profile
      );


      /* -------------------------------------------------------
         WHATSAPP MESSAGE
         ------------------------------------------------------- */

      let message =
        "🛍️ *BUYORA NEW ORDER*";

      message +=
        "\n\n";

      message +=
        "📦 *Order ID:* " +
        orderId;

      message +=
        "\n";

      message +=
        "👤 *Name:* " +
        name;

      message +=
        "\n";

      message +=
        "📞 *Phone:* " +

        "\n";

        city;

        "\n";

      message +=
        "📍 *Address:* " +
        address;

      if (email) {

          "\n";

        message +=
          "📧 *Email:* " +

      }

      message +=
        "\n\n";

      message +=
        "🛒 *PRODUCTS:*";

      message +=
        "\n";


      items.forEach(
        (item, index) => {

        );

    function trackOrder(event) {

      if (event) {

        event.preventDefault();

      }

      const input =
        document.getElementById(
          "trackingOrderId"
        );

      const result =
        document.getElementById(
          "trackingResult"
        );

      const orderId =
        input
          ? input.value.trim().toUpperCase()
          : "";


      if (!orderId) {

        showToast(
          "Enter your order ID.",
          "error"
        );

        return;

      }


      const order =
        orders.find(
          item =>
            String(item.id).toUpperCase() ===
            orderId
        );


      if (!order) {

        if (result) {

          result.innerHTML = `

            <div class="tracking-error">

              <div style="font-size:32px;">
                🔎
              </div>

              <h4>
                Order not found
              </h4>

              <p>
                Please check your Order ID and try again.
              </p>

            </div>

          `;

        }

        return;

      }


      const date =
        new Date(
          order.createdAt
        );


      const dateText =
        date.toLocaleDateString(
          "en-PK",
          {
            day: "2-digit",
            month: "short",
            year: "numeric"
          }
        );


      const itemList =
        order.items
          .map(
            item =>
              `
                <div
                  style="
                    display:flex;
                    justify-content:space-between;
                    gap:12px;
                    padding:8px 0;
                    border-bottom:1px solid #eee;
                  "
                >

                  <span>
                    ${escapeHTML(item.name)}
                    × ${item.quantity}
                  </span>

                  <strong>
                    ${formatPrice(
                      item.price *
                      item.quantity
                    )}
                  </strong>

                </div>
              `
          )
          .join("");


      if (result) {

        result.innerHTML = `

          <div class="tracking-card">

            <div
              style="
                display:flex;
                align-items:center;
                gap:12px;
                margin-bottom:15px;
              "
            >

              <div
                style="
                  width:48px;
                  height:48px;
                  border-radius:14px;
                  display:grid;
                  place-items:center;
                  background:#efe9ff;
                  font-size:23px;
                "
              >
                📦
              </div>

              <div>

                <strong>
                  ${escapeHTML(order.id)}
                </strong>

                <div
                  style="
                    color:#16a34a;
                    font-weight:700;
                    margin-top:3px;
                  "
                >
                  ${escapeHTML(order.status)}
                </div>

              </div>

            </div>

            <div
              style="
                background:#f7f5ff;
                padding:13px;
                border-radius:12px;
                margin-bottom:15px;
              "
            >

              <strong>
                Order Received / Processing
              </strong>

              <p
                style="
                  margin:5px 0 0;
                  color:#666;
                "
              >
                Your order has been recorded.
                Further delivery updates can be
                confirmed through WhatsApp.
              </p>

            </div>

            <div
              style="
                margin-bottom:15px;
              "
            >

              <strong>
                Order Date:
              </strong>

              ${dateText}

            </div>

            <div>

              <strong>
                Products
              </strong>

              <div
                style="
                  margin-top:8px;
                "
              >
                ${itemList}
              </div>

            </div>

            <div
              style="
                margin-top:15px;
                padding-top:12px;
                border-top:1px solid #ddd;
              "
            >

              <div class="summary-line">

                <span>
                  Subtotal
                </span>

                <strong>
                  ${formatPrice(order.subtotal)}
                </strong>

              </div>

              <div class="summary-line">

                <span>
                  Delivery
                </span>

                <strong>
                  ${
                    order.delivery === 0
                      ? "FREE"
                      : formatPrice(order.delivery)
                  }
                </strong>

              </div>

              <div class="summary-line total">

                <span>
                  Total
                </span>

                <strong>
                  ${formatPrice(order.total)}
                </strong>

              </div>

            </div>

          </div>

        `;

      }

    }


    /* =======================================================
       NEWSLETTER
       ======================================================= */

    function subscribeNewsletter(event) {

      if (event) {

        event.preventDefault();

      }

      const input =
        document.getElementById(
          "newsletterEmail"
        );

      if (!input) {
        return;
      }

      const email =
        input.value.trim().toLowerCase();


      if (!email) {

        showToast(
          "Please enter your email.",
          "error"
        );

        return;

      }


      if (
        !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(
          email
        )
      ) {

        showToast(
          "Please enter a valid email.",
          "error"
        );

        return;

      }


      let subscribers =
        loadStorage(
          STORAGE_KEYS.newsletter,
          []
        );


      if (
        subscribers.includes(email)
      ) {

        showToast(
          "This email is already subscribed."
        );

        return;

      }


      subscribers.push(email);

      saveStorage(
        STORAGE_KEYS.newsletter,
        subscribers
      );


      input.value = "";


      showToast(
        "You're subscribed to Buyora deals!",
        "success"
      );

    }


    /* =======================================================
       MOBILE MENU
       ======================================================= */

    function toggleMobileMenu() {

      const menu =
        document.getElementById(
          "mobileMenu"
        );

      const overlay =
        document.getElementById(
          "overlay"
        );


      if (!menu) {
        return;
      }


      const isOpen =
        menu.classList.contains("open");


      if (isOpen) {

        menu.classList.remove(
          "open"
        );

        if (overlay) {

          overlay.classList.remove(
            "active"
          );

        }

      } else {

        closeAllPanels();

        menu.classList.add(
          "open"
        );

        if (overlay) {

          overlay.classList.add(
            "active"
          );

        }

      }

    }

      if (menu) {

        menu.classList.remove(

    /* =======================================================
       SLIDER
       ======================================================= */

    function goSlide(index) {

      const slides =
        document.querySelectorAll(
          ".hero-slide"
        );

      const dots =
        document.querySelectorAll(
          ".slider-dot"
        );


      if (!slides.length) {
        return;
      }


      if (
        index < 0
      ) {

        index =
          slides.length - 1;

      }

      if (
        index >= slides.length
      ) {

        index = 0;

      }


      currentSlide =
        index;


      slides.forEach(
        (slide, i) => {

          slide.classList.toggle(
            "active",
            i === currentSlide
          );

        }
      );


      dots.forEach(
        (dot, i) => {

          dot.classList.toggle(
            "active",
            i === currentSlide
          );

        }
      );


      restartSlider();

    }


    function nextSlide() {

      const slides =
        document.querySelectorAll(
          ".hero-slide"
        );

      if (!slides.length) {
        return;
      }

      goSlide(
        currentSlide + 1
      );

    }


    function restartSlider() {

      clearInterval(
        sliderTimer
      );

      sliderTimer =
        setInterval(
          () => {

            const slides =
              document.querySelectorAll(
                ".hero-slide"
              );

            if (slides.length) {

              currentSlide =
                (currentSlide + 1) %
                slides.length;

              setSlideWithoutReset();

            }

          },
          4500
        );

    }


    function setSlideWithoutReset() {

      const slides =
        document.querySelectorAll(
          ".hero-slide"
        );

      const dots =
        document.querySelectorAll(
          ".slider-dot"
        );


      slides.forEach(
        (slide, i) => {

          slide.classList.toggle(
            "active",
            i === currentSlide
          );

        }
      );


      dots.forEach(
        (dot, i) => {

          dot.classList.toggle(
            "active",
            i === currentSlide
          );

        }
      );

    }
    /* =======================================================
       FINAL INITIALIZATION
       ======================================================= */

    function initSlider() {

      const slides =
        document.querySelectorAll(".hero-slide");

      const dots =
        document.querySelectorAll(".slider-dot");

      if (!slides.length) return;

      currentSlide = 0;

      slides.forEach((slide, index) => {
        slide.classList.toggle(
          "active",
          index === 0
        );
      });

      dots.forEach((dot, index) => {
        dot.classList.toggle(
          "active",
          index === 0
        );

        dot.addEventListener("click", () => {
          goSlide(index);
        });
      });

      restartSlider();
    }

          );

    /* =======================================================
       SMOOTH INTERNAL LINKS
       ======================================================= */

    function setupInternalLinks() {

      document
        .querySelectorAll(
          'a[href^="#"]'
        )
        .forEach(link => {

          link.addEventListener(
            "click",
            event => {

              const targetId =
                link.getAttribute("href");

              if (
                !targetId ||
                targetId === "#"
              ) {
                return;
              }

              const target =
                document.querySelector(
                  targetId
                );

              if (!target) return;

              event.preventDefault();

              closeAllPanels();

              target.scrollIntoView({
                behavior: "smooth",
                block: "start"
              });

            }
          );

        });

    }
